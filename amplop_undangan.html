<script>
  (function() {
    const btn = document.getElementById('openInvitationBtn');
    if (!btn) return;

    btn.addEventListener('click', function(e) {
      // Create tactile ripple feedback
      const ripple = document.createElement('span');
      ripple.className = 'absolute rounded-full bg-white/40 pointer-events-none animate-ping';
      ripple.style.width = '120px';
      ripple.style.height = '120px';
      ripple.style.left = (e.offsetX - 60) + 'px';
      ripple.style.top = (e.offsetY - 60) + 'px';
      this.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
        // Emit custom open event or trigger smooth view transition
        const openEvent = new CustomEvent('open-invitation', { bubbles: true });
        window.dispatchEvent(openEvent);
      }, 500);
    });
  })();
